<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" fill="none">
  <!-- Evidence Core: khối cầu vật chứng + vân tay, bao bởi quỹ đạo chuỗi block. Vẽ tay cho th4nhh4i. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b49aef" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#6d4fc2" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0b0b0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#eee4ff"/>
      <stop offset=".16" stop-color="#bba2f3"/>
      <stop offset=".52" stop-color="#5a3e9c"/>
      <stop offset="1" stop-color="#15111d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49aef" stop-opacity="0"/>
      <stop offset=".7" stop-color="#b49aef" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e3d6ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="orbitBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b49aef" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c7b0f6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b49aef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ff73" stop-opacity="0"/>
      <stop offset=".3" stop-color="#c9ff73" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#b49aef" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b49aef" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sphereClip"><circle cx="325" cy="325" r="150"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <circle cx="325" cy="325" r="300" fill="url(#glow)"/>

  <!-- Quỹ đạo phía sau khối cầu -->
  <ellipse cx="325" cy="325" rx="215" ry="120" transform="rotate(52 325 325)" stroke="#b49aef" stroke-opacity=".28" stroke-dasharray="2 7"/>
  <ellipse cx="325" cy="325" rx="250" ry="78" transform="rotate(-18 325 325)" stroke="url(#orbitBack)" stroke-width="1.3"/>

  <!-- Hex bytes trôi nổi -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2" fill="#7c7391">
    <text x="52" y="118" opacity=".7">4D 5A 90 00</text>
    <text x="52" y="136" opacity=".45">50 45 00 00</text>
    <text x="470" y="548" fill="#c9ff73" opacity=".55">46 4C 41 47</text>
    <text x="470" y="566" opacity=".4">7B 70 75 72</text>
  </g>

  <!-- Khối cầu vật chứng -->
  <circle cx="325" cy="325" r="150" fill="url(#sphere)"/>
  <g clip-path="url(#sphereClip)">
    <!-- Kinh tuyến / vĩ tuyến -->
    <g stroke="#f0e6ff" stroke-opacity=".16">
      <ellipse cx="325" cy="225" rx="112" ry="22"/>
      <ellipse cx="325" cy="275" rx="141" ry="28"/>
      <ellipse cx="325" cy="325" rx="150" ry="30"/>
      <ellipse cx="325" cy="375" rx="141" ry="28"/>
      <ellipse cx="325" cy="425" rx="112" ry="22"/>
      <g transform="rotate(-18 325 325)">
        <ellipse cx="325" cy="325" rx="45" ry="150"/>
        <ellipse cx="325" cy="325" rx="95" ry="150"/>
        <ellipse cx="325" cy="325" rx="132" ry="150"/>
      </g>
    </g>
    <!-- Vân tay -->
    <g stroke="#c9ff73" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round">
      <circle cx="350" cy="360" r="22" stroke-dasharray="90 20" transform="rotate(20 350 360)"/>
      <circle cx="350" cy="360" r="38" stroke-dasharray="150 30 40 20" transform="rotate(80 350 360)"/>
      <circle cx="350" cy="360" r="54" stroke-dasharray="200 26 80 34" transform="rotate(140 350 360)"/>
      <circle cx="350" cy="360" r="70" stroke-dasharray="260 40 90 50" transform="rotate(200 350 360)"/>
      <circle cx="350" cy="360" r="86" stroke-dasharray="320 30 120 70" transform="rotate(250 350 360)"/>
      <circle cx="350" cy="360" r="102" stroke-dasharray="380 60 150 50" transform="rotate(300 350 360)"/>
      <circle cx="350" cy="360" r="118" stroke-dasharray="420 90 140 90" transform="rotate(340 350 360)"/>
      <circle cx="350" cy="360" r="134" stroke-dasharray="460 120 160 100" transform="rotate(30 350 360)"/>
    </g>
    <!-- Ánh sáng -->
    <ellipse cx="268" cy="250" rx="62" ry="40" fill="#ffffff" opacity=".32" filter="url(#soft)"/>
    <circle cx="325" cy="325" r="148" stroke="url(#rim)" stroke-width="3" filter="url(#haze)"/>
  </g>
  <circle cx="325" cy="325" r="150" stroke="#e3d6ff" stroke-opacity=".18"/>

  <!-- Tâm ngắm -->
  <g stroke="#c9ff73" stroke-linecap="round">
    <circle cx="325" cy="325" r="16" stroke-opacity=".75"/>
    <path d="M325 297v14M325 339v14M297 325h14M339 325h14" stroke-opacity=".75"/>
    <circle cx="325" cy="325" r="2.5" fill="#c9ff73" stroke="none"/>
  </g>

  <!-- Quỹ đạo phía trước + chuỗi block -->
  <g transform="rotate(-18 325 325)">
    <path d="M75 325A250 78 0 0 0 575 325" stroke="url(#orbitFront)" stroke-width="2.2"/>
    <g stroke-width="1.3">
      <rect x="97.5" y="353" width="22" height="22" rx="5" fill="#141418" stroke="#b49aef"/>
      <rect x="105.5" y="361" width="6" height="6" rx="1.5" fill="#b49aef"/>
      <rect x="228.5" y="387.3" width="22" height="22" rx="5" fill="#141418" stroke="#b49aef"/>
      <rect x="236.5" y="395.3" width="6" height="6" rx="1.5" fill="#b49aef"/>
      <rect x="399.5" y="387.3" width="22" height="22" rx="5" fill="#141418" stroke="#c9ff73"/>
      <rect x="407.5" y="395.3" width="6" height="6" rx="1.5" fill="#c9ff73"/>
      <rect x="530.5" y="353" width="22" height="22" rx="5" fill="#141418" stroke="#c9ff73"/>
      <rect x="538.5" y="361" width="6" height="6" rx="1.5" fill="#c9ff73"/>
    </g>
    <g font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#9a91ae" letter-spacing="1">
      <text x="92" y="394">0x00…</text>
      <text x="222" y="428">0x9f3a</text>
      <text x="394" y="428">0x1404</text>
      <text x="522" y="394">HEAD</text>
    </g>
  </g>
</svg>
